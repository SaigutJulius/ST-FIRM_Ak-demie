<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ST-Firm Akädemie — Admin</title>
<style>
  :root{--navy:#0F1B5C;--navy-deep:#080E30;--gold:#C9A84C;--gold-light:#E8C96A;--green:#3AAB5C;--red:#E8896A;--gray:#A1A1A6;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,-apple-system,sans-serif;}
  body{background:linear-gradient(180deg,#16225E,#080E30);color:#fff;min-height:100vh;}
  a{color:var(--gold);}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;}
  .brand b span{color:var(--gold);}
  .chip{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);border:1px solid rgba(201,168,76,.4);padding:4px 12px;border-radius:980px;}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-weight:700;transition:transform .15s,box-shadow .15s,background .2s;}
  button:hover{transform:translateY(-2px);}
  .btn-gold{background:linear-gradient(180deg,var(--gold-light),var(--gold));color:var(--navy-deep);padding:12px 22px;box-shadow:0 6px 18px rgba(201,168,76,.4);}
  .btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);padding:9px 16px;}
  .btn-red{background:rgba(232,137,106,.15);color:var(--red);border:1px solid rgba(232,137,106,.4);padding:8px 14px;font-size:13px;}
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:24px;margin-bottom:22px;}
  input,textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:12px;color:#fff;padding:12px 14px;font-size:14px;outline:none;}
  input:focus,textarea:focus{border-color:var(--gold);}
  label{display:block;font-size:12px;color:var(--gray);margin:0 0 6px;letter-spacing:.3px;}
  h2{font-size:15px;font-weight:800;margin-bottom:16px;letter-spacing:.3px;}
  /* login */
  #login{max-width:380px;margin:12vh auto 0;}
  #login .card{padding:32px;}
  #login h1{font-size:22px;font-weight:900;margin-bottom:4px;}
  #login p{color:var(--gray);font-size:13px;margin-bottom:24px;}
  .field{margin-bottom:16px;}
  .err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;margin-top:6px;}
  /* stats */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
  .stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px;text-align:center;}
  .stat .n{font-size:30px;font-weight:900;color:var(--gold);}
  .stat .l{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-top:4px;}
  /* upload */
  .drop{border:2px dashed rgba(201,168,76,.4);border-radius:14px;padding:22px;text-align:center;color:var(--gray);cursor:pointer;transition:background .2s,border-color .2s;}
  .drop.drag{background:rgba(201,168,76,.1);border-color:var(--gold);}
  .drop b{color:var(--gold);}
  /* gallery grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden;}
  .item img{width:100%;height:150px;object-fit:cover;display:block;background:#fff;}
  .item .body{padding:12px;}
  .item textarea{font-size:13px;min-height:54px;resize:vertical;margin-bottom:8px;}
  .item .row{display:flex;gap:8px;}
  .item .row button{flex:1;font-size:12px;padding:8px;}
  .btn-save{background:rgba(58,171,92,.18);color:var(--green);border:1px solid rgba(58,171,92,.4);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:11px 22px;border-radius:980px;font-weight:700;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  .toast.err{background:var(--red);}
  .log{font-size:12px;color:var(--gray);line-height:1.9;max-height:230px;overflow:auto;}
  .log .a{color:#fff;font-weight:700;}
  .muted{color:var(--gray);font-size:12px;}
  .hidden{display:none;}
  @media(max-width:560px){.stats{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="wrap">
  <div class="card">
    <div class="chip" style="margin-bottom:18px;display:inline-block;">ST-Firm Akädemie</div>
    <h1>Admin Login</h1>
    <p>Manage your gallery — upload, caption, and remove photos.</p>
    <div class="field"><label>Username</label><input id="u" autocomplete="username"/></div>
    <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"/></div>
    <button class="btn-gold" style="width:100%" onclick="doLogin()">Log in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash" class="wrap hidden">
  <div class="topbar">
    <div class="brand"><b>ST-Firm <span>Akädemie</span></b> <span class="chip">Gallery Admin</span></div>
    <button class="btn-ghost" onclick="logout()">Log out</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>＋ Add a photo</h2>
    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      <b>Click to choose</b> or drag an image here
      <div class="muted" id="fileName" style="margin-top:6px;"></div>
    </div>
    <input id="file" type="file" accept="image/*" class="hidden"/>
    <div class="field" style="margin-top:14px;"><label>Caption (use **bold** with two asterisks for the bold part)</label>
      <input id="cap" placeholder="e.g. **Graduation Day** — Cohort 2026"/></div>
    <button class="btn-gold" onclick="uploadImg()">Upload to gallery</button>
  </div>

  <div class="card">
    <h2 id="galTitle">🖼 Current gallery</h2>
    <div class="grid" id="grid"></div>
  </div>

  <div class="card">
    <h2>📊 Activity log</h2>
    <div class="log" id="log"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "";                       // same origin (served by backend)
let token = localStorage.getItem("stfa_admin_token") || "";

function toast(msg, isErr){ const t=document.getElementById("toast"); t.textContent=msg; t.className="toast show"+(isErr?" err":""); setTimeout(()=>t.className="toast",1900); }
function authHeaders(){ return { "Authorization":"Bearer "+token }; }

async function doLogin(){
  const u=document.getElementById("u").value.trim(), p=document.getElementById("p").value;
  const e=document.getElementById("loginErr"); e.textContent="";
  try{
    const r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    if(!r.ok){ e.textContent=(await r.json()).detail||"Login failed"; return; }
    token=(await r.json()).token; localStorage.setItem("stfa_admin_token",token); showDash();
  }catch(err){ e.textContent="Cannot reach server."; }
}
function logout(){ token=""; localStorage.removeItem("stfa_admin_token"); document.getElementById("dash").classList.add("hidden"); document.getElementById("login").classList.remove("hidden"); }

function showDash(){ document.getElementById("login").classList.add("hidden"); document.getElementById("dash").classList.remove("hidden"); loadStats(); loadGallery(); }

async function loadStats(){
  try{
    const r=await fetch(API+"/api/stats",{headers:authHeaders()});
    if(r.status===401){ logout(); return; }
    const s=await r.json();
    document.getElementById("stats").innerHTML=
      stat(s.images,"Images")+stat(s.logins,"Logins")+stat(s.failed_logins,"Failed logins");
    document.getElementById("log").innerHTML=(s.recent||[]).map(x=>
      `<div><span class="a">${x.action}</span> · ${x.detail||""} <span class="muted">— ${x.ts.replace('T',' ').replace('+00:00','')}</span></div>`).join("")||"<div class='muted'>No activity yet.</div>";
  }catch(e){}
}
function stat(n,l){ return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

async function loadGallery(){
  const r=await fetch(API+"/api/gallery");
  const items=await r.json();
  document.getElementById("galTitle").textContent=`🖼 Current gallery (${items.length})`;
  document.getElementById("grid").innerHTML=items.map(it=>`
    <div class="item" data-id="${it.id}">
      <img src="${it.src}" alt=""/>
      <div class="body">
        <textarea>${(it.caption||"").replace(/</g,"&lt;")}</textarea>
        <div class="row">
          <button class="btn-save" onclick="saveCap(${it.id},this)">Save</button>
          <button class="btn-red" onclick="delImg(${it.id},this)">Delete</button>
        </div>
      </div>
    </div>`).join("")||"<div class='muted'>No images yet — upload your first photo above.</div>";
}

let chosen=null;
const fileInput=document.getElementById("file"), drop=document.getElementById("drop");
fileInput.addEventListener("change",()=>{ chosen=fileInput.files[0]; document.getElementById("fileName").textContent=chosen?chosen.name:""; });
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag");}));
drop.addEventListener("drop",e=>{ chosen=e.dataTransfer.files[0]; document.getElementById("fileName").textContent=chosen?chosen.name:""; });

async function uploadImg(){
  if(!chosen){ toast("Choose an image first",true); return; }
  const fd=new FormData(); fd.append("file",chosen); fd.append("caption",document.getElementById("cap").value);
  const r=await fetch(API+"/api/gallery",{method:"POST",headers:authHeaders(),body:fd});
  if(r.status===401){ logout(); return; }
  if(!r.ok){ toast((await r.json()).detail||"Upload failed",true); return; }
  chosen=null; fileInput.value=""; document.getElementById("fileName").textContent=""; document.getElementById("cap").value="";
  toast("Photo added ✓"); loadStats(); loadGallery();
}
async function saveCap(id,btn){
  const cap=btn.closest(".item").querySelector("textarea").value;
  const r=await fetch(API+"/api/gallery/"+id,{method:"PATCH",headers:{...authHeaders(),"Content-Type":"application/json"},body:JSON.stringify({caption:cap})});
  if(r.status===401){ logout(); return; }
  toast(r.ok?"Caption saved ✓":"Save failed",!r.ok); loadStats();
}
async function delImg(id,btn){
  if(!confirm("Delete this photo from the gallery?")) return;
  const r=await fetch(API+"/api/gallery/"+id,{method:"DELETE",headers:authHeaders()});
  if(r.status===401){ logout(); return; }
  toast(r.ok?"Photo deleted ✓":"Delete failed",!r.ok); loadStats(); loadGallery();
}

document.getElementById("p").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
if(token) showDash();
</script>
</body>
</html>
